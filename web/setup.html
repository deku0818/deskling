</style></head><body><header class="topbar"><div class="wordmark"><span class="mark" aria-hidden="true"></span>DESKLING</div><a href="/">返回主界面</a></header><main><div class="workbench"><section class="hub-side" aria-label="Hub 设备配置"><div class="surface-label"><span id="surface-name">HUB / 添加设备</span><span id="step-number">01 / 03</span></div><div class="hub" id="hub"></div></section><section class="device-side" aria-label="设备配置状态"><div class="surface-label"><span>设备状态</span><span>USB</span></div><div class="device-viewport"><div class="screen" id="screen"></div></div><p class="caption">配置状态来自设备 USB 通道。</p></section></div></main><script>(()=>{

const pairingPage=new URLSearchParams(location.search).has('pairing');
let editReturn='wifi',managedName='';
let view=pairingPage?'phone':'ports',ports=[],networks=[],info={},addresses=[],ssid='',password='',hubType='local',remoteHub='',localHub='',token='',useToken=false,showPassword=false,showToken=false,advanced=false,editKind='',job=0,generation=0,providerDraft='',feedback='',pending=[],pairUntil=0,submitting=false,remoteManage='http://127.0.0.1:8877/setup.html?pairing=1';
async function api(route,data){const r=await fetch('/manage/'+route,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let b;try{b=await r.json()}catch{throw Error('Hub 暂时未响应，请重试。')}if(!r.ok)throw Error(b.error||'操作失败，请重试。');return b;}

const hubName=()=>hubType==='remote'?'远程 Hub':'本机 Hub';
function validAddress(value){try{const u=new URL(value);return !/\s/.test(value)&&['http:','https:'].includes(u.protocol)&&u.hostname&&!u.username&&!u.password&&!u.hash&&!u.search&&u.pathname==='/';}catch{return false;}}
function bind(id,fn){if($(id))$(id).onclick=fn;}
function right(title,detail,kind='usb',code=''){$('screen').innerHTML=`<div class="nav"><h2>连接 Deskling</h2></div><div class="center">${icon(kind,'large-icon')}<div class="device-title">${escape(code||title)}</div><div class="device-copy">${escape(detail).replaceAll('\n','<br>')}</div></div><div class="device-foot"><span>${info.deviceId?'USB 已连接':view==='phone'?'配对管理':'等待连接'}</span><span>${view==='success'?'已连接':hubName()}</span></div>`;}
function manageLink(){return `<details class="advanced"><summary>打开远程配对管理</summary><p class="hint">在服务器本机或通过 SSH 隧道打开 Hub 配置页。</p><label class="field" for="remote-manage"><span>管理页地址</span><div class="input-wrap"><input id="remote-manage" value="${escape(remoteManage)}" inputmode="url" spellcheck="false"></div></label><button type="button" class="text-button" id="open-remote">打开管理页</button><p id="manage-error" class="field-error" role="alert"></p></details>`;}

function formMarkup(){
 const picker=`<p class="section-label">连接哪个 Hub</p><div class="hub-choice" role="group" aria-label="Hub 位置">${[['local','本机 Hub'],['remote','远程 Hub']].map(([id,label])=>`<button type="button" data-hub-type="${id}" aria-pressed="${hubType===id}">${icon(hubType===id?'done':'working','small-icon')}${label}</button>`).join('')}</div>`;
 const remote=hubType==='remote'?`<label class="field" for="hub-address"><span>远程 Hub 地址</span><div class="input-wrap"><input id="hub-address" value="${escape(remoteHub)}" placeholder="http://公网 IP:8787" maxlength="255" autocomplete="off" spellcheck="false" inputmode="url"></div></label><p class="hint">支持公网 IP 或域名，不需要填写 /ws。</p><details class="advanced" id="token-details" ${useToken?'open':''}><summary>使用已有 Token</summary><label class="field" for="token"><span>远程 Hub 的显示 Token</span></label><div class="input-wrap"><input id="token" aria-label="远程 Hub 的显示 Token" type="${showToken?'text':'password'}" value="${escape(token)}" maxlength="256" autocomplete="off" spellcheck="false" placeholder="粘贴远程 Hub 的 Token"><button class="reveal" type="button" id="reveal-token">${showToken?'隐藏':'显示'}</button></div><p class="hint">无需配对，连接验证成功后保存。</p></details>`:'<p class="hint">使用这台电脑的 Hub，地址和设备凭证自动配置。</p>';
 const wifi=editKind==='hub'?`<div class="fact"><span>Wi-Fi</span><span>${escape(info.ssid)} · 保留</span></div>`:`<div class="wifi-section"><div class="section-header"><span class="section-label">选择 Wi-Fi</span><button class="text-button" id="scan" type="button">重新扫描</button></div><div class="networks">${networks.map(n=>`<button type="button" class="network" data-ssid="${escape(n.ssid)}" aria-pressed="${n.ssid===ssid}"><span class="selector">${n.ssid===ssid?icon('done'):''}</span><span>${escape(n.ssid)}</span><span class="signal">${n.saved?'已保存':!n.secured?'开放':n.rssi>-65?'强':'一般'}</span></button>`).join('')||'<p class="muted">未扫描到网络，可在高级设置中手动填写。</p>'}</div><label class="field" for="password"><span>Wi-Fi 密码</span></label><div class="input-wrap"><input id="password" aria-label="Wi-Fi 密码" type="${showPassword?'text':'password'}" autocomplete="off" maxlength="64" value="${escape(password)}" placeholder="${info.configured&&ssid===info.ssid?'已保存，留空保留':'输入密码'}"><button class="reveal" id="reveal" type="button">${showPassword?'隐藏':'显示'}</button></div></div>`;
 return nav(editKind==='wifi'?'修改 Wi-Fi':editKind==='hub'?'更换 Hub':'添加设备')+`<div class="device-line"><div>Deskling<div class="meta">USB 已连接</div></div><span class="accent">${icon('usb')}</span></div><form id="form">${editKind==='wifi'?`<div class="fact"><span>${info.hubType==='remote'?'远程 Hub':'本机 Hub'}</span><span>保留当前配对</span></div>`:picker+remote}${wifi}<details class="advanced" id="advanced" ${advanced?'open':''}><summary>高级设置</summary>${editKind!=='hub'?`<label class="field" for="ssid"><span>Wi-Fi 名称</span><div class="input-wrap"><input id="ssid" value="${escape(ssid)}" maxlength="32"></div></label>`:''}${editKind!=='wifi'&&hubType==='local'?`<label class="field" for="local-hub"><span>本机 Hub 地址</span><div class="input-wrap"><input id="local-hub" value="${escape(localHub)}" placeholder="${escape(addresses[0]||'自动选择这台电脑的地址')}" inputmode="url"></div></label>`:''}</details><p class="field-error" id="form-error" role="alert">${escape(feedback)}</p><div class="actions"><button class="primary" ${submitting?'disabled':''}>验证并保存</button>${editKind?'<button type="button" class="text-button" id="cancel-edit">取消</button>':''}</div></form><p class="hint">${editKind?'验证成功后保存，失败保留原配置。':hubType==='remote'?'连接后在远程 Hub 中确认配对，或使用已有 Token。':'连接验证成功后保存。'}</p>`;
}
function bindForm(){
 document.querySelectorAll('[data-hub-type]').forEach(b=>b.onclick=()=>{hubType=b.dataset.hubType;feedback='';render()});document.querySelectorAll('[data-ssid]').forEach(b=>b.onclick=()=>{ssid=b.dataset.ssid;feedback='';render()});
 for(const [id,set] of [['password',v=>password=v],['ssid',v=>ssid=v],['hub-address',v=>remoteHub=v.trim()],['local-hub',v=>localHub=v.trim()],['token',v=>token=v.trim()]])if($(id))$(id).oninput=e=>set(e.target.value);

}
function render(){
 $('surface-name').textContent=view==='phone'?'HUB / 配对管理':view==='success'?'HUB / 设备':'HUB / 添加设备';$('step-number').textContent=view==='success'?'已连接':view==='progress'?'02 / 03':'01 / 03';

 }else if(view==='progress'){
  const s=info.stage,i=s==='wifi'?0:['hub','pair','pair_wait'].includes(s)?1:2,labels=['连接 Wi-Fi','连接'+hubName(),'保存配置'];
  $('hub').innerHTML=nav(s==='pair_wait'?'开启设备配对':s==='pair'?'等待确认配对':'连接设备')+`<div class="steps">${labels.map((label,n)=>`<div class="step" data-state="${n<i?'done':n===i?'active':'waiting'}"><span class="step-icon">${icon(n<i?'done':'working')}</span><div class="step-text">${label}<small>${escape(n===0?ssid:n===1?hubType==='remote'?remoteHub:'这台电脑':'验证成功后保存')}</small></div></div>`).join('')}</div>${s==='pair_wait'?`<div class="notice">${hubName()}尚未开启配对<p>在所选 Hub 管理页开启 5 分钟配对窗口。</p></div>`:''}${s==='pair'?`<div class="notice"><span>配对码</span><div class="pair-code">${escape(info.code)}</div><p>在${hubName()}中核对设备配对码并确认。</p></div>`:''}${hubType==='remote'&&['pair','pair_wait'].includes(s)?manageLink():''}<p class="field-error" role="alert">${escape(feedback)}</p><div class="actions"><button class="text-button" id="cancel">取消</button>${s==='pair_wait'?'<button class="text-button" id="manual-fallback">改用已有 Token</button>':''}</div>`;
  right(s==='pair_wait'?'等待配对':labels[i],info.detail||'等待设备响应','working',info.code);bindManagement();bind('cancel',cancel);bind('manual-fallback',async()=>{useToken=true;await cancel()});
 }else if(view==='error'){
  $('hub').innerHTML=nav('连接未完成')+`<div class="notice" role="alert">${escape(feedback)}<p>输入信息已保留${info.configured?'，原配置仍然保留。':'。'}</p></div><div class="actions"><button class="primary" id="edit">返回修改</button><button class="secondary" id="retry">重试连接</button></div>`;right('连接未完成',feedback,'error');bind('edit',()=>{view='wifi';render()});bind('retry',configure);
 }else if(view==='success'){
  $('hub').innerHTML=nav('Deskling')+icon('done','result-icon')+'<h2>已连接</h2><p class="result-copy">设备可以开始使用了。</p>'+`<div class="facts"><div class="fact"><span>Wi-Fi</span><span>${escape(info.ssid)}</span></div><div class="fact"><span>Hub</span><span>${info.hubType==='remote'?'远程 Hub':'本机 Hub'}</span></div><div class="fact"><span>地址</span><span class="address-value">${escape(info.hub)}</span></div><div class="fact"><span>设备凭证</span><span>已验证并保存</span></div></div><div class="actions"><button class="primary" id="settings">设备设置</button><button class="text-button" id="edit">修改 Wi-Fi</button></div><button class="text-button" id="change-hub">更换 Hub</button><div class="link-row"><button class="text-button" id="release">断开 USB 管理</button><button class="text-button" id="phone">添加其他设备</button></div><p class="field-error" role="alert">${escape(feedback)}</p>`;
  rightSettings();bind('settings',rightSettings);bind('edit',()=>beginEdit('wifi'));bind('change-hub',()=>beginEdit('hub'));bind('release',async()=>{try{await api('usb/close',{});info={};view='ports';loadPorts()}catch(e){feedback=e.message;render()}});
 }else if(view==='phone')renderPairing();
 bind('phone',startPhone);bind('back',async()=>{if(view==='progress'){await cancel();return}if(editKind){cancelEdit();return}generation++;feedback='';view='ports';loadPorts()});
}
function rightSettings(){providerDraft=info.provider||'claude';$('screen').innerHTML=`<div class="nav"><h2>配置</h2></div>${[['claude','Claude Code'],['codex','Codex']].map(([id,name])=>`<button class="setting-row" data-provider="${id}"><span class="selector">${providerDraft===id?icon('done'):''}</span>${name}</button>`).join('')}<button class="setting-row network-setting" id="network"><div>网络设置<small>${escape(info.ssid)} · ${info.hubType==='remote'?'远程 Hub':'本机 Hub'}</small></div></button><div class="saved" id="saved"></div><button class="primary save" id="provider-save">保存</button>`;
 document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{providerDraft=b.dataset.provider;document.querySelectorAll('[data-provider]').forEach(row=>row.querySelector('.selector').innerHTML=row.dataset.provider===providerDraft?icon('done'):'')});bind('provider-save',async()=>{const b=$('provider-save');b.disabled=true;try{await api('usb/provider',{provider:providerDraft});info.provider=providerDraft;$('saved').textContent='已保存'}catch(e){$('saved').textContent=e.message}b.disabled=false});bind('network',()=>{$('screen').innerHTML='<div class="nav"><h2>网络设置</h2></div><button class="setting-row" id="right-wifi">Wi-Fi</button><button class="setting-row" id="right-hub">Hub</button><button class="text-button" id="right-back">返回</button>';bind('right-wifi',()=>beginEdit('wifi'));bind('right-hub',()=>beginEdit('hub'));bind('right-back',rightSettings)});
}
function renderPairing(){
 const open=Date.now()<pairUntil;
 $('hub').innerHTML=nav('设备配对')+`<p class="muted">${escape(managedName)}</p>`+'<p class="muted">在设备的网络设置中点击“用手机配置”，或在 USB 配置页选择这个 Hub。</p>'+`<div class="facts"><div class="fact"><span>配对窗口</span><span>${open?'已开启 · 5 分钟':'未开启'}</span></div></div>${pending.map(r=>`<div class="notice"><span>Deskling 请求配对</span><p class="pair-code">${escape(r.code)}</p><p>确认与设备屏幕显示的配对码一致。</p><div class="actions"><button class="primary" data-approve="${r.id}">核对并允许配对</button><button class="text-button" data-reject="${r.id}">拒绝</button></div></div>`).join('')||(open?'<p class="hint">等待设备请求配对…</p>':'')}<p class="field-error" role="alert">${escape(feedback)}</p>${!open?'<button class="primary" id="restart-pair">开启配对</button>':'<p class="hint">配对窗口有效期为 5 分钟。</p>'}`;
 right(pending.length?'确认配对':'等待配对',pending.length?'核对设备上的配对码\n确认后自动保存设备凭证':'在这个 Hub 中开启配对','working',pending[0]?.code);
 for(const action of ['approve','reject'])document.querySelectorAll(`[data-${action}]`).forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('pairing/'+action,{id:b.dataset[action]});pending=pending.filter(r=>r.id!==b.dataset[action]);feedback=action==='approve'?'已确认，等待设备验证并保存。':'已拒绝配对。'}catch(e){feedback=e.message}render()});bind('restart-pair',startPhone);
}
function restoreFields(){ssid=info.ssid||'';password='';hubType=info.hubType||'local';remoteHub=hubType==='remote'?info.hub||'':'';localHub='';token='';useToken=false;showPassword=false;showToken=false;advanced=false;feedback='';}
function beginEdit(kind){generation++;editReturn=view==='success'?'success':'wifi';editKind=kind;restoreFields();view='wifi';render();if(kind==='wifi')scan()}
function cancelEdit(){generation++;editKind='';restoreFields();view=editReturn;render()}
async function loadPorts(){try{const [p,m]=await Promise.all([api('usb/ports'),api('info')]);ports=p.ports;addresses=m.addresses;feedback=''}catch(e){feedback=e.message}render()}
async function openUsb(){const path=$('port').value;if(!path)return;$('open').disabled=true;$('open').textContent='连接中…';const current=++generation;try{info=await api('usb/open',{path});while(info.busy&&current===generation){await new Promise(r=>setTimeout(r,1000));info=await api('usb/status')}if(current!==generation)return;restoreFields();editKind='';view=info.connected?'success':'wifi';render();if(view==='wifi')scan()}catch(e){feedback=e.message;render()}}
async function scan(){if(view!=='wifi')return;const current=generation;const b=$('scan');if(b){b.disabled=true;b.textContent='扫描中…'}try{const result=await api('usb/scan',{});if(current!==generation||view!=='wifi')return;networks=result.networks;if(info.configured&&!networks.some(n=>n.ssid===info.ssid))networks.unshift({ssid:info.ssid,secured:info.hasPassword,rssi:-99,saved:true});if(!ssid&&networks.length)ssid=networks[0].ssid;feedback='';render()}catch(e){if(current===generation&&view==='wifi'){feedback=e.message;render()}}}
async function configure(){
 if(submitting)return;
 const secured=networks.find(n=>n.ssid===ssid)?.secured!==false;
 if(editKind!=='hub'&&(!ssid||(password&&password.length<8)||(!password&&secured&&!(info.configured&&ssid===info.ssid)))){feedback='请选择 Wi-Fi 并输入密码。';view='wifi';render();return}
 if(editKind!=='wifi'){
  if(hubType==='remote'&&!validAddress(remoteHub)){feedback='填写 http:// 或 https:// 地址，不需要 /ws。';view='wifi';render();return}
  if(hubType==='remote'&&useToken&&!token){feedback='请填写远程 Hub 的显示 Token。';view='wifi';render();return}
 }
 const current=++generation;feedback='';submitting=true;const button=$('form')?.querySelector('.primary');if(button)button.disabled=true;
 try{const result=await api('usb/configure',{ssid,password,hubType,hub:hubType==='remote'?remoteHub:localHub,token,useToken,keepHub:editKind==='wifi',keepWifi:editKind==='hub',preservePassword:!password&&info.configured&&ssid===info.ssid});job=result.job;info={...info,stage:'wifi',detail:ssid};view='progress';render();poll(current)}catch(e){feedback=e.message;view='error';render()}finally{submitting=false}
}
async function cancel(){try{await api('usb/cancel',{});feedback='正在取消并恢复原配置…'}catch(e){feedback=e.message}render()}
async function poll(current){if(current!==generation)return;try{const status=await api('usb/status');if(current!==generation)return;if(status.job===job){const changed=status.stage!==info.stage||status.code!==info.code||status.error!==info.error;info=status;if(!status.busy&&status.stage==='done'){password='';token='';ssid=info.ssid;hubType=info.hubType||hubType;view='success';editKind='';render();return}if(!status.busy&&['error','cancelled'].includes(status.stage)){feedback=status.error||'已取消，原配置仍然保留。';view=status.stage==='cancelled'?'wifi':'error';render();return}view='progress';if(changed)render()}}catch(e){feedback=e.message;view='error';render();return}setTimeout(()=>poll(current),1000)}
async function startPhone(){const current=++generation;try{const window=await api('pairing/start',{});pairUntil=window.expiresAt;pending=[];feedback='';view='phone';render();phonePoll(current)}catch(e){feedback=e.message;render()}}
async function phonePoll(current){if(current!==generation||view!=='phone')return;try{const result=await api('info');const changed=JSON.stringify(result.pending)!==JSON.stringify(pending)||result.pairingOpen!==(Date.now()<pairUntil);pending=result.pending;pairUntil=result.pairingExpiresAt||0;if(changed)render()}catch(e){feedback=e.message;render()}if(Date.now()<pairUntil)setTimeout(()=>phonePoll(current),1500);else render()}
if(pairingPage){api('info').then(m=>{managedName=m.name;pending=m.pending;pairUntil=m.pairingExpiresAt||0;feedback='';render();phonePoll(generation)}).catch(e=>{feedback=e.message;render()})}else loadPorts();
})();
</script></body></html>
