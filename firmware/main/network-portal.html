<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deskling · 网络设置</title><style>
@font-face{font-family:Pixel;src:url('/font.woff2')}*{box-sizing:border-box}body{margin:0;background:#141413;color:#f0e9dc;font:12px/1.8 Pixel,monospace;font-synthesis:none}main{max-width:480px;margin:auto;padding:24px 20px}h1{font-size:24px;font-weight:400;margin:0 0 24px;padding:0 0 16px;border-bottom:1px solid #39342e}p{margin:12px 0;color:#9a9185}button,input,select{font:inherit;color:inherit;border-radius:0}button{cursor:pointer;min-height:44px}input,select{width:100%;background:transparent;border:1px solid #514333;padding:12px;min-height:48px}label{display:block;margin:16px 0;color:#9a9185}label span{display:block;margin-bottom:8px}.network{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;border-bottom:1px solid #39342e;background:transparent;padding:12px 0;text-align:left}.network[aria-pressed=true]{color:#ee9a62}.network small{margin-left:auto;color:#9a9185;font-size:12px}.primary{background:#2b211a;border:1px solid #ee9a62;color:#ee9a62;padding:12px 20px}.text{background:none;border:0;color:#9a9185;padding:8px 0}.actions{display:flex;gap:24px;align-items:center;margin-top:20px}.password{display:flex;border:1px solid #514333}.password input{border:0;min-width:0}.password button{border:0;background:none;color:#9a9185;padding:12px;flex:none}.error{color:#ee9a62;white-space:pre-wrap}details{color:#9a9185;margin:16px 0}summary{cursor:pointer;min-height:36px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}.steps div{min-height:72px;border-bottom:1px solid #39342e;display:flex;align-items:center;gap:16px}.active{color:#ee9a62}.code{font-size:28px;color:#ee9a62;letter-spacing:4px}.row{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #39342e}.row span:first-child{color:#9a9185}:focus-visible{outline:2px solid #ee9a62;outline-offset:4px}
.hub-choice{display:flex;gap:16px}.hub-choice button{flex:1;border:1px solid #514333;background:transparent;padding:8px;min-height:48px}.hub-choice button[aria-pressed=true]{color:#ee9a62;border-color:#ee9a62;background:#2b211a}.section-header{display:flex;justify-content:space-between;align-items:center}#networks{max-height:240px;overflow:auto}.address{overflow-wrap:anywhere;text-align:right;min-width:0}.row{gap:16px}.actions{flex-wrap:wrap}summary{list-style:none}summary:before{content:"+ "}details[open] summary:before{content:"- "}</style></head><body><main><h1>网络设置</h1><div id="content"><p>正在读取设备配置…</p></div></main><script>(()=>{
const el=document.getElementById('content'),$=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let info={},networks=[],ssid='',password='',hubType='local',localHub='',remoteHub='',token='',useToken=false,pair=false,showPassword=false,showToken=false,advanced=false,phase='form',timer,job=0,submitting=false,generation=0;
const hubName=()=>hubType==='remote'?'远程 Hub':'本机 Hub';
const hubValue=()=>hubType==='remote'?remoteHub:localHub;
async function api(url,data){const r=await fetch(url,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const t=await r.text();let result;try{result=JSON.parse(t)}catch{throw Error('设备暂时未响应，请重试。')}if(!r.ok)throw Error(result.error||'请求失败，请重试。');return result;}
function validAddress(value){try{const u=new URL(value);return !/\s/.test(value)&&['http:','https:'].includes(u.protocol)&&u.hostname&&!u.username&&!u.password&&!u.hash&&!u.search&&u.pathname==='/';}catch{return false;}}
function form(){phase='form';el.innerHTML=`<p>连接哪个 Hub</p><div class="hub-choice" role="group" aria-label="Hub 位置">${[['local','本机 Hub'],['remote','远程 Hub']].map(([id,label])=>`<button type="button" data-hub-type="${id}" aria-pressed="${hubType===id}">${hubType===id?'✓':'·'} ${label}</button>`).join('')}</div>${hubType==='remote'?'<p>填写远程服务器的地址。</p>':'<p>自动发现同一 Wi-Fi 下的 Hub。</p>'}<form id="form">${hubType==='remote'?`<label for="hub"><span>远程 Hub 地址</span><input id="hub" value="${escape(remoteHub)}" placeholder="http://公网 IP:8787" inputmode="url" maxlength="255" spellcheck="false"></label><p>支持公网 IP 或域名，不需要填写 /ws。</p><details id="token-details" ${useToken?'open':''}><summary>使用已有 Token</summary><label for="token"><span>远程 Hub 的显示 Token</span></label><div class="password"><input id="token" aria-label="远程 Hub 的显示 Token" type="${showToken?'text':'password'}" autocomplete="off" maxlength="256" value="${escape(token)}" placeholder="粘贴远程 Hub 的 Token"><button type="button" id="token-reveal">${showToken?'隐藏':'显示'}</button></div></details>`:''}<div class="section-header"><p>选择 Wi-Fi</p><button class="text" id="scan" type="button">重新扫描</button></div><div id="networks">${networks.map(n=>`<button type="button" class="network" data-ssid="${escape(n.ssid)}" aria-pressed="${n.ssid===ssid}"><span>${n.ssid===ssid?'✓':'·'}</span>${escape(n.ssid)}<small>${n.saved?'已保存':!n.secured?'开放':n.rssi>-65?'强':'一般'}</small></button>`).join('')||'<p>尚未扫描到网络，可手动填写。</p>'}</div><label for="password"><span>Wi-Fi 密码</span></label><div class="password"><input id="password" aria-label="Wi-Fi 密码" type="${showPassword?'text':'password'}" autocomplete="off" maxlength="64" value="${escape(password)}" placeholder="${info.configured&&ssid===info.ssid?'已保存，留空保留':'输入密码'}"><button id="reveal" type="button">${showPassword?'隐藏':'显示'}</button></div><details id="advanced" ${advanced?'open':''}><summary>高级设置</summary><label for="ssid"><span>Wi-Fi 名称</span><input id="ssid" value="${escape(ssid)}" maxlength="32"></label>${hubType==='local'?`<label for="local-hub"><span>本机 Hub 地址</span><input id="local-hub" value="${escape(localHub)}" placeholder="自动发现正在配对的 Hub" maxlength="255" inputmode="url"></label>`:''}</details><p id="error" class="error" role="alert"></p><div class="actions"><button class="primary" ${submitting?'disabled':''}>验证并保存</button></div></form><p>连接成功后保存，失败保留原配置。</p><p>${info.configured&&!pair?'未更换 Hub 时继续保留当前配对。':`在${hubName()}管理页开启配对，或填写已有 Token。`}</p>${info.configured?'<button class="text" id="repair">重新配对 Hub</button>':''}`;
 el.querySelectorAll('[data-hub-type]').forEach(b=>b.onclick=()=>{hubType=b.dataset.hubType;form()});el.querySelectorAll('[data-ssid]').forEach(b=>b.onclick=()=>{ssid=b.dataset.ssid;form()});
 for(const [id,set] of [['password',v=>password=v],['ssid',v=>ssid=v],['hub',v=>remoteHub=v.trim()],['local-hub',v=>localHub=v.trim()],['token',v=>token=v.trim()]])if($(id))$(id).oninput=e=>set(e.target.value);
 $('advanced').ontoggle=e=>advanced=e.target.open;if($('token-details'))$('token-details').ontoggle=e=>useToken=e.target.open;
 $('reveal').onclick=()=>{showPassword=!showPassword;$('password').type=showPassword?'text':'password';$('reveal').textContent=showPassword?'隐藏':'显示'};
 if($('token-reveal'))$('token-reveal').onclick=()=>{showToken=!showToken;$('token').type=showToken?'text':'password';$('token-reveal').textContent=showToken?'隐藏':'显示'};
 $('scan').onclick=scan;if($('repair'))$('repair').onclick=()=>{pair=true;useToken=false;token='';if(hubType==='local')localHub='';form()};$('form').onsubmit=submit;
}
async function submit(e){e.preventDefault();if(submitting)return;const secured=networks.find(n=>n.ssid===ssid)?.secured!==false;const error=$('error');if(!ssid||(!password&&secured&&!(info.configured&&ssid===info.ssid))||(password&&password.length<8)){error.textContent='请选择 Wi-Fi 并输入密码。';return}if(hubType==='remote'&&!validAddress(remoteHub)){error.textContent='填写 http:// 或 https:// 地址，不需要 /ws。';return}if(hubType==='remote'&&useToken&&!token){error.textContent='请填写远程 Hub 的显示 Token。';return}
 const keepHub=info.configured&&!pair&&hubType===(info.hubType||'local')&&hubValue()===(info.hub||'')&&!(hubType==='remote'&&useToken);
 const values={ssid,password,preservePassword:!password&&ssid===info.ssid,keepHub};
 if(!keepHub)Object.assign(values,{hubType,hub:hubValue(),token:hubType==='remote'&&useToken?token:'',hubId:'',pair:!(hubType==='remote'&&useToken)});
 submitting=true;e.target.querySelector('.primary').disabled=true;
 try{const result=await api('/configure',values);job=result.job;phase='progress';poll(++generation)}catch(e){error.textContent=e.message;submitting=false;$('form').querySelector('.primary').disabled=false}
}
async function scan(){const current=generation,button=$('scan');if(button){button.disabled=true;button.textContent='扫描中…'}try{networks=(await api('/scan')).networks;if(current!==generation||phase!=='form')return;if(info.configured&&!networks.some(n=>n.ssid===info.ssid))networks.unshift({ssid:info.ssid,secured:info.hasPassword,rssi:-99,saved:true});if(!ssid&&networks.length)ssid=networks[0].ssid;form()}catch(e){if($('error'))$('error').textContent=e.message;if(button){button.disabled=false;button.textContent='重新扫描'}}}
async function poll(current){clearTimeout(timer);if(current!==generation)return;try{const s=await api('/status');if(current!==generation)return;if(s.job!==job){timer=setTimeout(()=>poll(current),1000);return}const step=s.stage==='wifi'?0:['hub','pair','pair_wait'].includes(s.stage)?1:2;el.innerHTML=`<div class="steps">${['连接 Wi-Fi','连接'+hubName(),'保存配置'].map((v,i)=>`<div class="${i===step?'active':''}">${i<step?'✓':i===step?'▸':'·'} ${v}</div>`).join('')}</div>${s.stage==='pair_wait'?`<p>在${hubName()}管理页开启设备配对。</p>${hubType==='remote'?'<p>通过服务器本机或电脑上的 SSH 隧道访问管理页。</p>':''}`:''}${s.code?`<p class="code">${escape(s.code)}</p><p>在${hubName()}管理页核对配对码并确认。</p>`:''}<p id="error" class="error" role="alert"></p><div class="actions"><button class="text" id="cancel">取消</button></div>`;$('cancel').onclick=async()=>{await api('/cancel',{}).catch(()=>{});};if(!s.busy&&s.stage==='done'){password='';token='';info=s;submitting=false;phase='done';el.innerHTML=`<h1>已连接</h1><div class="row"><span>Wi-Fi</span><span>${escape(s.ssid)}</span></div><div class="row"><span>Hub</span><span>${s.hubType==='remote'?'远程 Hub':'本机 Hub'}</span></div><div class="row"><span>地址</span><span class="address">${escape(s.hub)}</span></div><div class="row"><span>设备凭证</span><span>已验证并保存</span></div><p>配网热点将在一分钟后关闭。<br>可以切回日常使用的 Wi-Fi。</p>`;return}if(!s.busy&&['error','cancelled'].includes(s.stage)){phase='error';submitting=false;$('error').textContent=s.error||'已取消，原配置仍然保留。';$('cancel').textContent='返回修改';$('cancel').onclick=form;return}}catch(e){el.innerHTML='<p>等待设备响应…</p><p>如果热点短暂断开，请重新连接同一个 Deskling 热点。</p>';}
 timer=setTimeout(()=>poll(current),1000);
}
api('/status').then(s=>{info=s;ssid=s.ssid||'';hubType=s.hubType||'local';localHub=s.pairRequested?'':hubType==='local'?s.hub||'':'';remoteHub=hubType==='remote'?s.hub||'':'';pair=!s.configured||s.pairRequested;form();scan()}).catch(e=>{el.textContent=e.message});
})();
</script></body></html>
